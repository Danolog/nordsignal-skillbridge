name: Przeglad Leo

# ─────────────────────────────────────────────────────────────────────────────
# MASZYNOWA EGZEKUCJA BRAMKI (a) DELEGACJI ETHANA.
#
# `CLAUDE.md` sekcja 5 mowi: „Leo review przed kazdym scaleniem". Przez trzy
# miesiace ta bramka trzymala sie WYLACZNIE dyscypliny dwoch agentow — nic jej
# nie egzekwowalo. 2026-08-14 Ethan zatrzymal scalenie #306 (zero przegladow)
# recznie; nic go do tego nie zmuszalo, wiec rownie dobrze mogl nie zauwazyc.
#
# DLACZEGO NIE NATYWNY MECHANIZM PRZEGLADU GITHUBA
# ------------------------------------------------
# Wszystkie nasze zgloszenia otwiera to samo konto — wymog Vercela: autor commita
# musi byc Darek (bramka (d) delegacji). GitHub odmawia przegladu wlasnego
# zgloszenia:
#     „Can not request changes on your own pull request"   (zmierzone przez Leo)
# Czyli przeglad Leo NIGDY nie stanie sie natywnym statusem. Etykieta jest
# obejsciem tego ograniczenia, nie wynalazkiem.
#
# POLARYZACJA: DOMYSLNIE ZAMKNIETE
# --------------------------------
# Swiadoma zmiana wobec pierwotnej propozycji („etykieta ZABLOKOWANE, bramka pada
# gdy etykieta obecna"). Tamta polaryzacja NIE ZLAPALABY przypadku, ktory ja
# zrodzil: #306 nie mialo zadnej etykiety, wiec bramka „pada gdy obecna"
# przepuscilaby je bez slowa.
#
#   etykieta-weto  chroni przed Leo, ktory ZDAZYL zareagowac;
#   etykieta-zgoda chroni przed przegladem, ktorego NIKT NIE ZROBIL.
#
# Bramka (a) mowi o tym drugim. Zapomnienie ma konczyc sie zablokowaniem, nie
# przepuszczeniem — domyslny stan ma byc bezpieczny.
#
# DLACZEGO OSOBNY PLIK, A NIE JOB W `pr.yml`
# ------------------------------------------
# Bramka musi reagowac na zdarzenia `labeled`/`unlabeled`, inaczej po nadaniu
# etykiety status nigdy sie nie odswiezy. Dopisanie tych zdarzen do `pr.yml`
# przeliczaloby przy KAZDEJ zmianie etykiety cala suite — z czterema zadaniami
# Playwrighta wlacznie. Osobny plik kosztuje kilkanascie sekund runnera.
#
# CZEGO TA BRAMKA NIE ROBI — granica jawna
# ----------------------------------------
# NIE jest rozdzialem obowiazkow. Ta sama osoba moze nadac etykiete i scalic.
# Wymusza SWIADOMOSC i zostawia SLAD (kto nadal, kiedy, na ktorym commicie), ale
# nie uniemozliwia obejscia. Prawdziwy rozdzial wymaga drugiej tozsamosci
# w GitHubie — osobna decyzja Darka (koszt, nowe poswiadczenie), nie efekt
# uboczny sprzatania CI.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` sa tu istota rzeczy: bez nich status nie odswiezylby
    # sie po nadaniu etykiety i bramka byla by wiecznie czerwona.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Zero uprawnien zapisu. Ta bramka tylko czyta wlasne zdarzenie.
# WIAZANIE ETYKIETY Z COMMITEM (dolozone 2026-08-14, znalezisko Leo)
# ------------------------------------------------------------------
# Pierwsza wersja tej bramki sprawdzala TYLKO obecnosc etykiety. Etykieta
# przezywa nowe commity — GitHub jej nie zdejmuje — wiec przeglad commita A
# plus dopchniety commit B dawal ZIELONA BRAMKE NA KODZIE, KTOREGO NIKT NIE
# WIDZIAL. Bramka majaca chronic przed brakiem przegladu sama by go prala.
#
# To nie byla teoria. Zmierzone na zgloszeniu #318, ktore te bramke wprowadzalo:
#     etykieta nadana : 2026-08-14T14:28:07Z
#     commit glowy    : 2026-08-14T14:43:38Z   (odswiezenie galezi, 15 min pozniej)
#     werdykt bramki  : success
# Bramka przepuscila commit, ktory nie istnial w chwili przegladu.
#
# DLACZEGO ODSWIEZENIE GALEZI TEZ UNIEWAZNIA PRZEGLAD (swiadomie, mimo tarcia):
# przy `strict: true` kazde scalenie w partii wymusza odswiezenie pozostalych,
# wiec Leo bedzie etykietowal ponownie po kazdym odswiezeniu. To jest cecha, nie
# koszt: scalenie `main` do galezi POTRAFI po cichu skasowac czyjas prace przy
# zielonej suicie (konflikt rozwiazany „biore swoja strone"). Drzewo po scaleniu
# to inne drzewo niz to, ktore Leo czytal — wiec przeglad faktycznie wygasl.
# Zadnych sprytnych wyjatkow dla „to tylko scalenie main": sprytna bramka
# bezpieczenstwa to bramka, ktorej nikt nie umie zweryfikowac.
#
# DLACZEGO PORZADEK CZASOWY, A NIE AUTOMATYCZNE ZDEJMOWANIE ETYKIETY:
# zdejmowanie wymagaloby uprawnienia ZAPISU (`pull-requests: write`) i psuloby
# sie CICHO — nieudane zdjecie zostawia zielona bramke (awaria w strone
# niebezpieczna). Odczyt psuje sie GLOSNO: nie da sie odczytac osi czasu, job
# pada, bramka jest czerwona. Przy bramce bezpieczenstwa wybieramy awarie
# w strone zamknieta.
#
# COFNIECIE GALEZI — DRUGA DZIURA, ZAMKNIETA 2026-08-24 (znalezisko Leo)
# ---------------------------------------------------------------------
# Porownanie „etykieta mlodsza niz commit glowy" lapie przypadek, dla ktorego
# powstalo: commit DOLOZONY po przegladzie ma date pozniejsza, wiec bramka
# czerwienieje. Nie lapie przypadku ODWROTNEGO: gdy glowa galezi COFNIE SIE do
# commita STARSZEGO, etykieta zostaje mlodsza i bramka melduje „przeglad swiezy",
# choc drzewo zmienilo sie PO przegladzie.
#
# To nie byla teoria — drugi raz w historii tej bramki. Zmierzone na #343:
#     14:55:35Z  labeled przeglad-leo-ok    (po przegladzie glowy 8518d6f)
#     14:58:24Z  head_ref_force_pushed      (glowa cofnieta o commit)
#     glowa teraz: 27d502d, data commita 14:18:40Z — STARSZA niz etykieta
#     werdykt starej logiki: success
# Bramka potwierdzala przeglad drzewa, ktorego Leo nie widzial: z galezi zniknal
# caly commit (86 wstawien) oceniany w przegladzie imiennie.
#
# NAPRAWA: punktem odniesienia jest NAJPOZNIEJSZE ze zdarzen zmiany drzewa —
# data commita glowy ORAZ ostatnie `head_ref_force_pushed`. Znacznik wymuszenia
# ustawia SERWER (nie klient), wiec cofniecie galezi jest widoczne niezaleznie
# od dat commitow.
#
# SPROSTOWANIE PROPOZYCJI (Leo, ta sama godzina): pierwsza wersja tej poprawki
# miala porownywac ze zdarzeniem `synchronize` — tak brzmiala tez rekomendacja
# w akapicie ponizej, sprzed dzisiaj. TAKIEGO ZDARZENIA W OSI CZASU NIE MA:
# `synchronize` jest zdarzeniem webhooka (wyzwala ten przebieg), a nie wpisem
# osi czasu. Zmierzone — pelna lista typow zdarzen zwracanych przez
# `issues/<n>/timeline` dla #342, #343 i #345:
#     commented committed cross-referenced deployed head_ref_force_pushed
#     labeled mentioned merged referenced subscribed unlabeled unsubscribed
# Trwalym, serwerowym sladem zmiany drzewa jest `head_ref_force_pushed` i to on
# wchodzi do porownania.
#
# CZEGO TA POPRAWKA NADAL NIE LAPIE (jawnie, zeby nie robic wrazenia pelnego
# pokrycia — trzeci raz dzisiaj okazalo sie, ze straznik widzi wezszy swiat, niz
# deklaruje):
#   (a) commit DOLOZONY zwyklym pchnieciem, z data commitera cofnieta w przeszlosc
#       (`GIT_COMMITTER_DATE`). Zwykle pchniecie nie tworzy `head_ref_force_pushed`,
#       a data jest wtedy klienta. Model zagrozenia to ZAPOMNIENIE wlasnych
#       agentow, nie falszerstwo — jak dotad. Domkniecie wymagaloby porownywania
#       SHA przegladanej glowy, a tego oś czasu przy zdarzeniu `labeled` nie niesie.
#   (b) zmiana BAZY zgloszenia (`base_ref_changed`) — inne drzewo scalenia przy
#       tej samej glowie. Nie widzialem tego u nas ani razu; wpisane, bo brak
#       wpisu bylby milczeniem, nie brakiem ryzyka.
#   (c) obejscie przez zmiane TEGO pliku w samym zgloszeniu. Zmierzone dzis na
#       #343: nowe zadanie dolozone do `pr.yml` w zgloszeniu URUCHOMILO SIE na tym
#       samym zgloszeniu, wiec plik przeplywu nie jest chroniony przed edycja
#       z galezi. Ta bramka wymusza SWIADOMOSC i zostawia SLAD; nie jest ochrona
#       przed kims, kto ja swiadomie rozbraja (patrz akapit „CZEGO TA BRAMKA NIE
#       ROBI" wyzej).

permissions:
  contents: read
  # Odczyt osi czasu zgloszenia (zdarzenia `labeled`). Wylacznie odczyt —
  # ta bramka niczego nie zapisuje.
  pull-requests: read
  issues: read

concurrency:
  group: przeglad-leo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  przeglad-leo:
    name: przeglad-leo (bramka (a) delegacji — etykieta po przegladzie)
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdz etykiete przegladu i jej swiezosc
        # Etykiety przez `env:`, NIGDY przez interpolacje `${{ }}` wprost do
        # skryptu: nazwa etykiety jest trescia sterowana przez czlowieka, wiec
        # w ciele `run:` bylaby wektorem wstrzyku polecen. Ten job nie ma
        # uprawnien zapisu, ale wzorzec ma byc poprawny tam, gdzie ktos go skopiuje.
        #
        # Separator `|`, nie przecinek: nazwy etykiet GitHuba moga zawierac
        # przecinek, nie moga zawierac `|`.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMER: ${{ github.event.pull_request.number }}
          GLOWA_SHA: ${{ github.event.pull_request.head.sha }}
          ETYKIETY: ${{ join(github.event.pull_request.labels.*.name, '|') }}
          WYMAGANA: przeglad-leo-ok
        run: |
          set -euo pipefail

          # ── CZLON 1: czy etykieta w ogole jest ──────────────────────────────
          if ! printf '%s' "$ETYKIETY" | tr '|' '\n' | grep -Fxq "$WYMAGANA"; then
            echo "::error title=Brak przegladu Leo::Zgloszenie nie ma etykiety '$WYMAGANA'."
            cat >&2 <<'KONIEC'

          BRAMKA (a) DELEGACJI: scalenie wymaga przegladu Leo (CLAUDE.md sekcja 5).

          Ta bramka jest DOMYSLNIE ZAMKNIETA. Zieleni sie dopiero, gdy na
          zgloszeniu pojawi sie etykieta `przeglad-leo-ok` — nadaje ja Leo
          po przegladzie.

          Nie nadawaj jej sobie sam, zeby „odblokowac": to jedyny slad, ze
          przeglad sie odbyl.
          KONIEC
            exit 1
          fi

          # ── CZLON 2: czy etykieta jest MLODSZA niz commit glowy ─────────────
          # Awaria w strone zamknieta: pusty odczyt = czerwone, nigdy zielone.
          #
          # STRONICOWANIE (poprawka po przegladzie Leo): `--paginate` stosuje
          # wyrazenie `--jq` DO KAZDEJ STRONY OSOBNO. Konstrukcja `[…] | last`
          # dawalaby wiec „ostatni wpis KAZDEJ strony" — tyle linii, ile stron —
          # i przy zgloszeniu z dluga osia czasu (ponad 100 zdarzen) do zmiennej
          # trafilby zlepek kilku znacznikow zamiast jednego. Porownanie nizej
          # bierze wtedy smieci. Dlatego: wypisujemy PLASKO wszystkie pasujace
          # znaczniki (po jednym w linii, ze wszystkich stron), sortujemy i bierzemy
          # ostatni — czyli faktycznie najnowsze nadanie etykiety.
          #
          # Sortowanie tekstowe jest tu rownowazne chronologicznemu, bo GitHub
          # zwraca znaczniki w ISO 8601 W UTC (przyrostek `Z`), o stalej dlugosci.
          # Gdyby kiedykolwiek zaczal zwracac przesuniecia stref (`+02:00`),
          # to zalozenie pada i trzeba przejsc na `date -d`.
          CZAS_ETYKIETY="$(gh api "repos/$REPO/issues/$NUMER/timeline" --paginate \
            --jq ".[] | select(.event == \"labeled\" and .label.name == \"$WYMAGANA\") | .created_at" \
            | sort | tail -n 1)"
          # Tu `--paginate` nie wystepuje (pojedynczy obiekt), wiec `max` liczy sie raz.
          #
          # UWAGA NA `null` (sprostowanie Leo, 2026-08-14): gdy pol nie ma, `max`
          # NIE daje pustego napisu — `jq` wypisuje czteroznakowy napis `null`.
          # Zmierzone:
          #     $ echo '{"commit":{"committer":{},"author":{}}}' \
          #         | jq '[.commit.committer.date, .commit.author.date] | max'
          #     null
          # Wczesniejszy komentarz twierdzil, ze pustka zalatwia sprawe. Nieprawda:
          # `[ -z "null" ]` jest FALSZEM, wiec galaz „pusty odczyt" sie NIE odpala.
          # Bramka i tak konczy sie czerwono, ale INNYM mechanizmem — porownaniem
          # tekstowym, bo cyfry sortuja sie przed literami, wiec "2026-…" < "null".
          # To jest poprawnosc PRZYPADKOWA: trzyma sie tego, ze data zaczyna sie
          # cyfra, a slowo `null` litera. Ktos, kto zmieni format daty albo doda
          # `// empty`, rozbroi ja nie wiedzac, ze cokolwiek rozbraja.
          #
          # Dlatego `null` odrzucamy JAWNIE, razem z pustka — zeby zamkniecie
          # bramki bylo wlasnoscia zapisana, a nie skutkiem ubocznym tablicy ASCII.
          CZAS_GLOWY="$(gh api "repos/$REPO/commits/$GLOWA_SHA" \
            --jq '[.commit.committer.date, .commit.author.date] | max')"

          # ZDARZENIE COFNIECIA GALEZI — znacznik SERWEROWY, nie klienta.
          #
          # `head_ref_force_pushed` pojawia sie przy kazdym wymuszonym pchnieciu,
          # w tym przy cofnieciu glowy do STARSZEGO commita. Bez tego czlonu
          # cofniecie przechodzilo na zielono: etykieta zostawala mlodsza niz
          # (stara) data commita glowy. Zmierzone na #343 — cytat w naglowku.
          #
          # PUSTY WYNIK JEST TU LEGALNY: wiekszosc zgloszen nie ma ani jednego
          # wymuszonego pchniecia. Awaria ODCZYTU nadal zamyka bramke, bo
          # `set -o pipefail` przewraca krok, gdy `gh api` padnie — czyli pusty
          # napis znaczy „nie bylo zdarzenia", a nie „nie udalo sie sprawdzic".
          CZAS_WYMUSZENIA="$(gh api "repos/$REPO/issues/$NUMER/timeline" --paginate \
            --jq '.[] | select(.event == "head_ref_force_pushed") | .created_at' \
            | sort | tail -n 1)"

          # SPRAWDZENIE KSZTALTU, NIE LISTY ZAKAZANYCH WARTOSCI (uwaga Leo).
          #
          # Poprzednia wersja odrzucala pustke i `null` — czyli wyliczala WARTOSCI,
          # ktore znamy. Zmierzone przez Leo: `"false"` i `"brak"` przechodzily na
          # zielono. Nie chodzi o to, ze interfejs je zwroci; chodzi o to, ze
          # bylismy JEDNA WARTOSCIA od tej samej wady, a dwie osoby zdazyly sie
          # dzis pomylic przy tej logice.
          #
          # Teraz orzekamy POZYTYWNIE: przechodzi wylacznie to, co ma ksztalt
          # znacznika czasu ISO 8601 w UTC. Cokolwiek innego — pustka, `null`,
          # `false`, komunikat bledu, uszkodzone zdarzenie osi czasu — pada.
          #
          # Efekt uboczny, ktory jest tu celem: to sprawdzenie EGZEKWUJE zalozenie
          # o UTC, na ktorym stoi porownanie tekstowe nizej. Do tej pory zalozenie
          # bylo opisane w komentarzu i nie pilnowane niczym — gdyby interfejs
          # zaczal zwracac przesuniecie strefy (`+02:00`), porownanie milczaloby,
          # a wynik bylby bledny. Teraz zatrzyma sie glosno.
          znacznik_poprawny() {
            case "$1" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! znacznik_poprawny "$CZAS_ETYKIETY" || ! znacznik_poprawny "$CZAS_GLOWY"; then
            echo "::error title=Nie da sie zweryfikowac swiezosci::Odczyt osi czasu lub commita nie ma ksztaltu znacznika UTC."
            echo "etykieta='$CZAS_ETYKIETY' glowa='$CZAS_GLOWY'" >&2
            echo "Oczekiwany ksztalt: RRRR-MM-DDTHH:MM:SSZ (ISO 8601, UTC)." >&2
            exit 1
          fi

          # PUNKT ODNIESIENIA = NAJPOZNIEJSZA ZMIANA DRZEWA, nie sama data commita.
          # Znacznik wymuszenia sprawdzamy tym samym orzeczeniem ksztaltu, co
          # pozostale — inaczej uszkodzone zdarzenie osi czasu przeszloby cicho.
          CZAS_ODNIESIENIA="$CZAS_GLOWY"
          ZRODLO_ODNIESIENIA="commit glowy"
          if [ -n "$CZAS_WYMUSZENIA" ]; then
            if ! znacznik_poprawny "$CZAS_WYMUSZENIA"; then
              echo "::error title=Nie da sie zweryfikowac swiezosci::Zdarzenie cofniecia galezi nie ma ksztaltu znacznika UTC."
              echo "head_ref_force_pushed='$CZAS_WYMUSZENIA'" >&2
              exit 1
            fi
            if [ "$CZAS_ODNIESIENIA" \< "$CZAS_WYMUSZENIA" ]; then
              CZAS_ODNIESIENIA="$CZAS_WYMUSZENIA"
              ZRODLO_ODNIESIENIA="cofniecie galezi (head_ref_force_pushed)"
            fi
          fi

          echo "Etykieta nadana : $CZAS_ETYKIETY"
          echo "Commit glowy    : $CZAS_GLOWY  ($GLOWA_SHA)"
          echo "Cofniecie glowy : ${CZAS_WYMUSZENIA:-brak zdarzenia}"
          echo "Punkt odniesien.: $CZAS_ODNIESIENIA  (zrodlo: $ZRODLO_ODNIESIENIA)"

          # Oba znaczniki przychodza z API GitHuba w ISO 8601 W UTC (przyrostek
          # `Z`, stala dlugosc `YYYY-MM-DDTHH:MM:SSZ`) — nie ma tu stref lokalnych
          # ani czasu letniego, wiec porownanie
          # leksykograficzne jest rownowazne porownaniu chronologicznemu.
          if [ "$CZAS_ETYKIETY" \< "$CZAS_ODNIESIENIA" ]; then
            echo "::error title=Przeglad wygasl::Etykieta jest starsza niz ostatnia zmiana drzewa."
            cat >&2 <<KONIEC

          PRZEGLAD WYGASL — ETYKIETA STARSZA NIZ OSTATNIA ZMIANA DRZEWA.

          Etykieta nadana : $CZAS_ETYKIETY
          Commit glowy    : $CZAS_GLOWY
          Cofniecie glowy : ${CZAS_WYMUSZENIA:-brak zdarzenia}
          Punkt odniesien.: $CZAS_ODNIESIENIA  (zrodlo: $ZRODLO_ODNIESIENIA)

          Po przegladzie Leo drzewo sie zmienilo — doszedl commit ALBO glowa
          galezi zostala COFNIETA. Etykieta zostala, bo GitHub jej nie zdejmuje —
          ale potwierdza przeglad KODU, KTOREGO JUZ NIE MA.

          Cofniecie jest grozniejsze od dolozenia, bo z galezi ZNIKA praca, ktora
          ktos ocenil imiennie — a data commita glowy jest wtedy STARSZA niz
          etykieta, wiec sama data niczego nie wykrywa (zmierzone na #343,
          2026-08-24: cofniecie 3 minuty po nadaniu etykiety, werdykt „success").

          Dotyczy to takze zwyklego odswiezenia galezi: scalenie `main` do galezi
          potrafi po cichu skasowac czyjas prace przy zielonej suicie. Drzewo po
          scaleniu to inne drzewo niz to, ktore Leo czytal.

          Co zrobic: Leo zdejmuje etykiete i nadaje ja PONOWNIE po obejrzeniu
          biezacej glowy. Nadanie bez ponownego spojrzenia zamienia te bramke
          w ozdobe.
          KONIEC
            exit 1
          fi

          echo "Przeglad Leo potwierdzony i swiezy (etykieta mlodsza niz ostatnia zmiana drzewa: $ZRODLO_ODNIESIENIA)."
          exit 0
