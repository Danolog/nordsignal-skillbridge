name: PR

# K4 (CI) — brama jakości każdego PR-u do main. ADR-001 sekcja 4.1 (6 jobów).
# Bez zielonego CI merge zablokowany (branch protection — konfiguracja administracyjna).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # e2e-llm: tor nocny (Ethan Z6 §4 — „nocny TERAZ, blokujący per-PR PRZED Betą").
  # schedule = przebieg bez kosztu per-PR; workflow_dispatch = ręczne odpalenie.
  # NIGDY pull_request_target (audyt Ryana, warunek 2): ten trigger biega z sekretami
  # repo + kodem z PR-a = wektor wycieku klucza. Zostajemy na pull_request.
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC ≈ 05:00 Europe/Warsaw — poza godzinami pracy
  workflow_dispatch: {}

# Anuluj starsze przebiegi tego samego PR-a (oszczędność minut runnera) — ale
# WYŁĄCZNIE dla PR-ów. Przebiegi `push` do `main` i tor nocny dobiegają do końca.
#
# DLACZEGO (Quinn 2026-08-01, sprostowane przez Leo w review #263).
#
# Mechanizm, który tu naprawiamy, jest JEDEN: anulowany przebieg `push` kasuje
# jedyny ślad, że `main` faktycznie przeszedł bramki. Dla treści prywatnej to
# szczególnie dotkliwe — przebieg PO SCALENIU jest JEDYNYM, który dostaje sekret
# `CONTENT_REPO_KEY` przy PR-ach Dependabota i z forków, czyli jedynym dowodem, że
# kontrakty banku pytań i atomów przeszły (docs/runbooks/tresc-prywatna.md §5 pkt 2).
#
# CZEGO TU NIE MA, choć w pierwszej wersji tego komentarza było: „przez to stoją
# scalenia". To NIEPRAWDA przy obecnej konfiguracji. `branches/main/protection` ma
# `strict: false`, a 12 wymaganych kontekstów PR-a pochodzi z przebiegu
# `pull_request` na SHA głowy gałęzi (zweryfikowane na `9edf012`: komplet zielony).
# Przebiegi `push` wieszają check-runy na commitach `main`, które NIE bramkują
# scalenia żadnego PR-a. Zdanie usunięte, bo komentarz jest rejestrem decyzji —
# fałszywe uzasadnienie skończyłoby się „naprawą" scalania gdzie indziej i cofnięciem
# tej zmiany jako zbędnej. (Gdyby kiedyś włączyć `strict: true` albo kolejkę scaleń,
# zdanie stanie się prawdziwe i wtedy warto je przywrócić — RAZEM z tym warunkiem.)
#
# DLACZEGO KLUCZ GRUPY, A NIE SAM `cancel-in-progress` (Leo, N2/N3):
# `cancel-in-progress: false` NIE wystarcza. Przebiegi tej samej grupy nie są wtedy
# anulowane w locie, tylko KOLEJKOWANE — a wejście nowszego do kolejki anuluje ten
# czekający. Przy wspólnej grupie `…-refs/heads/main` seria scaleń pod rząd (czyli
# dokładnie ceremonia) nadal zostawiałaby anulowane przebiegi pośrednie. Dowód:
# run 29830179915 — `cancelled`, 15 s, **0 jobów**, czyli zero wystawionych
# kontekstów. Tor nocny dzieli `github.ref` z `push`, więc scalenie o 03:0x czekałoby
# na `e2e-llm`, a trzecie zdarzenie skasowałoby czekający przebieg.
#
# Stąd klucz grupy PER SHA poza PR-ami: każdy commit na `main` dostaje własną grupę,
# więc nie ma czego kolejkować ani anulować. `github.event_name` w kluczu rozdziela
# dodatkowo tor nocny od `push` na tym samym SHA.
#
# KOSZT, świadomie kupiony: każdy push do `main` biegnie teraz do końca — ~13 jobów,
# w tym cztery Playwrightowe. Płacimy minutami runnera za dowód, że `main` jest
# zielony. To zakup, nie efekt uboczny.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test (vitest)
    runs-on: ubuntu-latest
    env:
      # Placeholdery — testy unit nie łączą się z bazą; klient db
      # konstruuje się leniwie (src/lib/db/index.ts), env tylko by import nie pękł.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Krok 4 partia 5+6+7: kontrakt-testy notebooków M-PD/M-SQL/M-EDA wykonują
      # komórki realnym python3 (harness ADR-015). M-PD importuje pandas, laby
      # M-SQL dodatkowo duckdb, a M-EDA — requests (EDA.1/EDA.4 wychodzą do API
      # GUS BDL; test podmienia samo WYWOŁANIE na atrapę, więc `import requests`
      # wykonuje się naprawdę). Pinujemy do wersji COLABA, nie lokalnej (maszyna
      # dev ma duckdb 1.5.x) — student ma dostać to, co przetestowane.
      #
      # ⚠ ŻADNEJ WERSJI W TYM PLIKU (ADR-016 D1). Jedyne źródło prawdy to
      # tools/content/notebooks/srodowisko-colab.json; ten krok tylko je czyta.
      # Dopisanie biblioteki = wpis w deklaracji, nie edycja workflow.
      - name: Piny środowiska z deklaracji (ADR-016 D1 — jedyne źródło prawdy)
        run: |
          PINY="$(pnpm tsx tools/srodowisko-colab.ts --piny | tail -n 1)"
          if [ -z "${PINY}" ]; then
            echo "::error::Deklaracja srodowisko-colab.json nie oddała żadnego pinu — krok pip nie ma czego instalować."
            exit 1
          fi
          echo "Piny z deklaracji: ${PINY}"
          echo "PIP_PINY=${PINY}" >> "$GITHUB_ENV"
      - run: python3 -m pip install ${PIP_PINY}
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
      - run: pnpm test:run

  integration:
    name: integration (drizzle migrate + seed + k3-validate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/skillbridge_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 1. Brama integracyjna Bety: wszystkie migracje Drizzle stosują się czysto
      # na świeżej bazie. Złamana/niespójna migracja = czerwone CI.
      - run: pnpm db:migrate
      # 2. §8 #1 Phase 2 / sub-issue #19i (rls-matrix.md): seed potrzebny do
      # testów izolacji 5/6 (wymagają wierszy) + testów 10c FORCE deny-default
      # (wymaga przynajmniej 1 wiersza, żeby SELECT WYKLUCZYŁ go pod app_student
      # bez current_user_id).
      - run: pnpm db:seed
      # 3. tools/k3-validate.ts — testy 1..10/10 zielone = K3 RLS DoD spełnione
      # (sekcja §7 rls-matrix.md). Exit code 1 przy jakimkolwiek FAIL.
      - run: pnpm tsx tools/k3-validate.ts
      # 4. Testy integracyjne vitest (projekt `integration`, **/*.integration.test.{ts,tsx})
      # — realna ścieżka renderu na zmigrowanej + zaseedowanej bazie kontenera. Job `test`
      # (unit) je wyklucza; tu, gdzie jest Postgres, faktycznie się wykonują. DATABASE_URL
      # jobu (@localhost:5432/skillbridge_test) trafia w strażnik isLocalTestDb → suite leci.
      - run: pnpm test:integration

  build:
    name: build (next build)
    runs-on: ubuntu-latest
    env:
      # Placeholdery — `next build` zbiera dane stron i ewaluuje moduły
      # (m.in. instancję Better Auth). Env tylko po to, by importy nie pękły;
      # realny deploy bierze sekrety z Vercela. Ten job łapie błędy, których
      # lint/typecheck nie widzą (np. errorHandler→onError w pluginie auth).
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action czyta listę commitów PR-a przez API → wymaga pull-requests:read.
    # Workflow-level `permissions: contents: read` to odcinał (octokit 403 → crash).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps-scan:
    name: deps-scan (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blokuje na podatnościach high/critical; moderate/low raportowane,
      # nie wywalają PR-u (szum na Becie). Dependabot pilnuje reszty.
      # Skrypt deps:scan = jedno źródło progu (parytet CI ↔ lokalne `pnpm deps:scan`).
      - run: pnpm deps:scan

  # ─────────────────────────────────────────────────────────────────────────
  # a11y-exam — Playwright + @axe-core/playwright, TWARDA bramka WCAG na 3
  # ekranach UI egzaminu modułowego (1E.3). Warunek Leo przed zapłonem
  # FLAG_MASTERY_GATE na prod (opcja A z review: dedykowany, BLOKUJĄCY job).
  #
  # BLOKUJĄCY: brak `if:` (jak lint/typecheck/test/integration/build) — biega na
  # pull_request i push do main; fail axe = czerwony check PR-a. (Wpięcie do
  # required-status-checks to osobna, administracyjna zmiana branch protection —
  # poza plikiem workflow; patrz raport Evy.)
  #
  # BEZ MODELU: trzy ścieżki a11y nie wołają LLM — (a) ekran startowy „confirm",
  # (b)/(c) mockują POST /api/exam/start (page.route 201 / 423). Stąd BRAK klucza
  # ANTHROPIC i BRAK override modelu — job tańszy i szybszy od e2e-llm.
  #
  # DLACZEGO POSTGRES + REDIS/SRH: strona egzaminu to server component, który robi
  # notFound() gdy modułu o danym UUID nie ma w bazie → wszystkie 3 ścieżki
  # najpierw page.goto(/curriculum/<UUID>/exam) i potrzebują ZASEEDOWANEJ bazy.
  # `next start` (build produkcyjny) ma boot-guard rate-limitera — bez configu
  # Upstash serwer nie wstaje; lokalny redis + SRH (REST zgodny z Upstash na
  # loopbacku) go zaspokajają, zero sekretów prod (identycznie jak e2e-llm).
  a11y-exam:
    name: a11y-exam (Playwright + @axe-core skan bramki 1E.3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          # Token loopbacku CI — NIE sekret (para do UPSTASH_REDIS_REST_TOKEN
          # niżej; forma „example-" celowa: to jawny placeholder, nie poświadczenie).
          SRH_TOKEN: example-e2e-ci-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
    env:
      # Placeholder testowy (32 znaki) — nie sekret. Realny prod bierze z Vercela.
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example-e2e-ci-token
      BETTER_AUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # OBIE flagi — exam page robi notFound() bez AND (page.tsx:32). Bez nich skan
      # renderowałby 404, a „zielono" nic by nie znaczyło. Playwright webServer
      # dziedziczy env procesu joba → `next start` widzi obie flagi zapalone.
      FLAG_MASTERY_GATE: "1"
      FLAG_CURRICULUM_PATH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ustaw DATABASE_URL/E2E_DATABASE_URL + poświadczenia konta testowego
        env:
          PGUSER: test
          PGPASS: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDB: skillbridge_test
        run: |
          AT='@'
          CREDS="${PGUSER}:${PGPASS}"
          DSN="postgresql://${CREDS}${AT}${PGHOST}:${PGPORT}/${PGDB}"
          echo "DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # seed:e2e czyta E2E_DATABASE_URL (osobna nazwa, ten sam loopback DSN).
          echo "E2E_DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # Konto MAIN — poświadczenia zgodne z domyślami seed-e2e.ts. Test loguje
          # się (loginWithPassword "main") w beforeEach. Dane konta TESTOWEGO, nie sekret.
          CRED='Test1234!e2e'
          echo "E2E_TEST_EMAIL=e2e-main@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=${CRED}" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Migracja schematu na bazie TESTOWEJ (guard allowlisty hostów testowych).
      - run: pnpm db:migrate:test
      # Konta + student „main" (loginWithPassword). Idempotentny, guardowany allowlistą.
      - run: pnpm seed:e2e
      # FIXTURE modułu bramki: strona egzaminu robi notFound(), jeśli moduł o tym
      # UUID nie istnieje (curriculum_modules.id = defaultRandom() — żaden ingest
      # nie dostarcza tego stałego ID). UUID żyje w JEDNYM miejscu
      # (tests/e2e-pw/fixtures/a11y-fixture-ids.ts — importuje je spec 62 ORAZ
      # seeder), więc spec i baza nie mogą się rozjechać. Seeder reużywa guarda
      # assertTestDb (hard-deny prod-DSN, allowlista hostów lokalnych), wstawia
      # idempotentnie (ON CONFLICT (id) DO NOTHING) i SAM weryfikuje „dokładnie
      # 1 wiersz" — pada GŁOŚNO, gdy fixture nie wszedł, zamiast mylącego timeoutu
      # przycisku w skanie. Zdejmuje niejawną zależność od klienta psql na runnerze.
      # „Bramka MUSI paść głośno, gdy brak danych, nie zzielenieć na pusto."
      - name: Fixtures a11y (moduł egzaminu — stały UUID, seeder guardowany)
        run: pnpm exec tsx tools/fixtures/seed-a11y-fixtures.ts
      # Build artefaktu produkcyjnego — `next start` (webServer configu CI) go serwuje.
      - run: pnpm build
      # ZAKRES: TYLKO plik 62 (3 testy @safe). Podanie ŚCIEŻKI PLIKU = zero
      # zależności od --grep → nie ma jak zostać zeskipowanym przez filtr (w
      # przeciwieństwie do e2e-llm, który --grep @llm wyklucza @safe).
      - name: Playwright — skan a11y egzaminu (bramka 1E.3)
        run: pnpm exec playwright test --config playwright.config.ci.ts tests/e2e-pw/62-1e3-exam-a11y.spec.ts
      # Artefakty diagnostyczne przy padzie (trace/screenshot — raport axe w stdout).
      - name: Upload raportu Playwright (przy padzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-exam
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # a11y-tutor — Playwright + @axe-core, twarda bramka DOSTĘPNOŚCI panelu tutora
  # sokratycznego (C11) przed zapaleniem FLAG_SOCRATIC_TUTOR na prod. Analog
  # a11y-exam wyżej: ten sam harness, te same tagi WCAG, ta sama zasada „mock
  # zamiast żywego LLM" (GET/POST /api/projects/*/tutor mockowane w specie 63 —
  # zero klucza ANTHROPIC, zero kosztu modelu). BLOKUJĄCY (brak `if:`).
  #
  # DETERMINIZM: spec 63 wchodzi na /projects/<STAŁY UUID> (TUTOR_PROJECT_ID z
  # tests/e2e-pw/fixtures/a11y-fixture-ids.ts), a nie przez katalog — seeder
  # tools/fixtures/seed-a11y-fixtures.ts wstawia ten projekt do bazy testowej.
  #
  # SERWISY + POSTGRES/REDIS/SRH: jak a11y-exam — detal projektu to server
  # component czytający bazę (notFound() bez wiersza projektu), a `next start`
  # (build produkcyjny) ma boot-guard rate-limitera, który zaspokaja lokalny
  # redis + SRH (REST zgodny z Upstash na loopbacku). Zero sekretów prod.
  a11y-tutor:
    name: a11y-tutor (Playwright + @axe-core skan panelu tutora C11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: example-e2e-ci-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
    env:
      # Placeholder testowy (32 znaki) — nie sekret. Realny prod bierze z Vercela.
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example-e2e-ci-token
      BETTER_AUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Flaga tutora — bez niej server component (page.tsx:75) przekazuje
      # tutorEnabled=false i <TutorPanel> nie trafia do DOM → skan nie miałby czego
      # skanować. Playwright webServer dziedziczy env procesu joba → `next start` ją widzi.
      FLAG_SOCRATIC_TUTOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ustaw DATABASE_URL/E2E_DATABASE_URL + poświadczenia konta testowego
        env:
          PGUSER: test
          PGPASS: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDB: skillbridge_test
        run: |
          AT='@'
          CREDS="${PGUSER}:${PGPASS}"
          DSN="postgresql://${CREDS}${AT}${PGHOST}:${PGPORT}/${PGDB}"
          echo "DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # Konto MAIN — spec 63 loguje się (loginWithPassword "main") w beforeEach.
          CRED='Test1234!e2e'
          echo "E2E_TEST_EMAIL=e2e-main@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=${CRED}" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Migracja schematu na bazie TESTOWEJ (guard allowlisty hostów testowych).
      - run: pnpm db:migrate:test
      # Konta + student „main" (loginWithPassword). Idempotentny, guardowany allowlistą.
      - run: pnpm seed:e2e
      # FIXTURE projektu tutora (stały UUID). Detal projektu robi notFound() bez
      # wiersza projektu → panel tutora nie wyrenderowałby się. Ten sam seeder co
      # a11y-exam (jedno źródło UUID, guard assertTestDb, weryfikacja 1 wiersza).
      - name: Fixtures a11y (projekt tutora — stały UUID, seeder guardowany)
        run: pnpm exec tsx tools/fixtures/seed-a11y-fixtures.ts
      # Build artefaktu produkcyjnego — `next start` (webServer configu CI) go serwuje.
      - run: pnpm build
      # ZAKRES: TYLKO plik 63 (4 testy @safe). Ścieżka pliku = zero zależności od --grep.
      - name: Playwright — skan a11y panelu tutora (bramka C11)
        run: pnpm exec playwright test --config playwright.config.ci.ts tests/e2e-pw/63-c11-tutor-a11y.spec.ts
      # Artefakty diagnostyczne przy padzie (trace/screenshot — raport axe w stdout).
      - name: Upload raportu Playwright (przy padzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-tutor
          path: playwright-report/
          retention-days: 7

  # a11y-review — Playwright + @axe-core, twarda bramka DOSTĘPNOŚCI sesji powtórek
  # rozłożonych w czasie (1E.4 R6) przed zapaleniem FLAG_SPACED_REPETITION na prod.
  # Analog a11y-exam / a11y-tutor: ten sam harness, te same tagi WCAG, ta sama
  # zasada „mock zamiast żywego LLM/DB" (GET /api/review/queue + POST
  # /api/review/answer mockowane w specie 64 — zero klucza ANTHROPIC, zero DB
  # zapisu, zero kosztu modelu). BLOKUJĄCY (brak `if:`).
  #
  # BEZ FIXTURE DB (odwrotnie niż a11y-exam/a11y-tutor): strona /powtorki nie czyta
  # żadnego wiersza domenowego — potrzebuje tylko zalogowanego studenta (redirect
  # na /onboarding bez niego), którego daje `seed:e2e` (konto „main"). Kolejka i
  # ocena są mockowane w specie, więc nie ma czego seedować do review_states.
  # (Ścieżka /powtorki, NIE /review — /review zajmuje kolejka recenzji człowieka B8.)
  #
  # SERWISY + POSTGRES/REDIS/SRH: jak a11y-tutor — /powtorki to server component
  # (notFound() bez flagi, redirect bez studenta), a `next start` (build
  # produkcyjny) ma boot-guard rate-limitera zaspokajany lokalnym redis + SRH.
  a11y-review:
    name: a11y-review (Playwright + @axe-core skan sesji powtórek 1E.4 R6)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: example-e2e-ci-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
    env:
      # Placeholder testowy (32 znaki) — nie sekret. Realny prod bierze z Vercela.
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example-e2e-ci-token
      BETTER_AUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Flaga powtórek — bez niej /powtorki robi notFound() (page.tsx) → skan nie
      # miałby czego skanować. Playwright webServer dziedziczy env procesu joba.
      FLAG_SPACED_REPETITION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ustaw DATABASE_URL/E2E_DATABASE_URL + poświadczenia konta testowego
        env:
          PGUSER: test
          PGPASS: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDB: skillbridge_test
        run: |
          AT='@'
          CREDS="${PGUSER}:${PGPASS}"
          DSN="postgresql://${CREDS}${AT}${PGHOST}:${PGPORT}/${PGDB}"
          echo "DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # Konto MAIN — spec 64 loguje się (loginWithPassword "main") w beforeEach.
          CRED='Test1234!e2e'
          echo "E2E_TEST_EMAIL=e2e-main@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=${CRED}" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Migracja schematu na bazie TESTOWEJ (guard allowlisty hostów testowych).
      - run: pnpm db:migrate:test
      # Konta + student „main" (loginWithPassword). Idempotentny, guardowany allowlistą.
      # /powtorki potrzebuje TYLKO tego studenta — reszta (kolejka, ocena) jest mockowana.
      - run: pnpm seed:e2e
      # Build artefaktu produkcyjnego — `next start` (webServer configu CI) go serwuje.
      - run: pnpm build
      # ZAKRES: TYLKO plik 64 (5 testów @safe). Ścieżka pliku = zero zależności od --grep.
      - name: Playwright — skan a11y sesji powtórek (bramka 1E.4 R6)
        run: pnpm exec playwright test --config playwright.config.ci.ts tests/e2e-pw/64-1e4-review-a11y.spec.ts
      # Artefakty diagnostyczne przy padzie (trace/screenshot — raport axe w stdout).
      - name: Upload raportu Playwright (przy padzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-review
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # rate-limit-review — Playwright, DOWÓD ŻYWEGO LIMITERA na POST /api/review/answer
  # (1E.4 R4/CF-2, bramka Quinn — domknięcie zapłonu FLAG_SPACED_REPETITION). W
  # przeciwieństwie do a11y-review (mock trasy przez page.route) TU walimy w PRAWDZIWY
  # endpoint z ŻYWYM limiterem (Upstash SDK → SRH → Redis) i sprawdzamy realne 429 +
  # scope w body. Unit (review-routes.test.ts) mockuje applyRateLimit — dowodzi
  # kontraktu trasa→runner, ale NIE że żywy limiter faktycznie pęka. Ten job zamyka
  # dokładnie tę lukę (lekcja Quinn: „zielony test ≠ działający kod, jeśli mockuje
  # to, co realnie pęka").
  #
  # MATRYCA (dwie komórki): trasa sprawdza burst PRZED daily, oba inkrementują ten sam
  # klucz — w jednym procesie wychodzi tylko scope o NIŻSZYM progu. Żeby pokryć OBA
  # scope naprawdę, odpalamy spec dwa razy z różnym progiem (override prod-safe z
  # rate-limit.ts; Vercel tych zmiennych NIE ustawia → prod = 60/min, 200/dzień):
  #   - burst: RATE_LIMIT_REVIEW_ANSWER=3, daily=200 → 4. żądanie pęka na burst
  #   - daily: answer=60, RATE_LIMIT_REVIEW_DAILY=3  → 4. żądanie pęka na daily
  # SERWISY + POSTGRES/REDIS/SRH: identyczne z a11y-review — /api/review/answer ma
  # boot-guard rate-limitera zaspokajany lokalnym redis + SRH (bez SRH limiter NO-OP
  # i 429 nigdy nie pada — czyli test wykrywa regresję „limiter wyłączony"). Zero
  # sekretów prod.
  rate-limit-review:
    name: rate-limit-review (Playwright — realny 429 scope=${{ matrix.scope }} 1E.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: burst
            answer: "3"
            daily: "200"
          - scope: daily
            answer: "60"
            daily: "3"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: example-e2e-ci-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
    env:
      # Placeholder testowy (32 znaki) — nie sekret. Realny prod bierze z Vercela.
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example-e2e-ci-token
      BETTER_AUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Flaga powtórek — bez niej /api/review/answer robi 404 (trasa nie istnieje).
      FLAG_SPACED_REPETITION: "1"
      # Progi testowe (override prod-safe) + oczekiwany scope — z matrycy.
      RATE_LIMIT_REVIEW_ANSWER: ${{ matrix.answer }}
      RATE_LIMIT_REVIEW_DAILY: ${{ matrix.daily }}
      EXPECTED_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ustaw DATABASE_URL/E2E_DATABASE_URL + poświadczenia konta testowego
        env:
          PGUSER: test
          PGPASS: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDB: skillbridge_test
        run: |
          AT='@'
          CREDS="${PGUSER}:${PGPASS}"
          DSN="postgresql://${CREDS}${AT}${PGHOST}:${PGPORT}/${PGDB}"
          echo "DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # Konto MAIN — spec 65 loguje się (E2E_TEST_EMAIL/PASSWORD) i wala w limiter.
          CRED='Test1234!e2e'
          echo "E2E_TEST_EMAIL=e2e-main@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=${CRED}" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Migracja schematu na bazie TESTOWEJ (guard allowlisty hostów testowych).
      - run: pnpm db:migrate:test
      # Student „main" (loginWithPassword) — spec potrzebuje TYLKO zalogowanego studenta;
      # body oceny to losowe UUID (limiter pęka przed lookupem, więc bank pytań zbędny).
      - run: pnpm seed:e2e
      # Build artefaktu produkcyjnego — `next start` (webServer configu CI) go serwuje.
      - run: pnpm build
      - name: Playwright — realny 429 scope=${{ matrix.scope }} (żywy SRH)
        run: pnpm exec playwright test --config playwright.config.ci.ts tests/e2e-pw/65-1e4-review-rate-limit.spec.ts
      - name: Upload raportu Playwright (przy padzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rate-limit-${{ matrix.scope }}
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # e2e-llm — Playwright, sciezka krytyczna #1 (rejestracja -> onboarding ->
  # dashboard) z REALNYM wolaniem modelu (Z5 spec, segment B @llm).
  #
  # TOPOLOGIA (decyzja Darka 2026-06-26): tor WYLACZNIE NOCNY (schedule) na Haiku.
  #   - schedule (nocny 03:00 UTC) — jedyny automatyczny przebieg; bez kosztu per-PR/push;
  #   - workflow_dispatch — reczny bezpiecznik (odpalany swiadomie, nie sam);
  #   - NIE biega na pull_request ani push do main (warunek if: nizej). Pozostale joby
  #     workflow (lint, typecheck, test, integration, build, secret-scan, deps-scan)
  #     DALEJ leca na PR i push — przyciecie dotyczy WYLACZNIE tego joba, nie triggerow
  #     `on:` calego workflow.
  #   - NON-BLOCKING na start: ten job NIE jest w required checks (branch protection
  #     administruje Darek). Flip na required = osobna decyzja PRZED go-live Bety
  #     (Z6 §4 opcja 1). Powod non-blocking: e2e z modelem bywa flaky/koszt — nie
  #     wpuszczamy nowego, niesprawdzonego e2e od razu jako twardej bramki.
  #
  # BEZPIECZENSTWO (audyt Ryana 2026-06-23):
  #   - klucz secrets.ANTHROPIC_API_KEY_CI (osobny od prod, sufit wydatkow u Darka);
  #   - klucz WYLACZNIE przez env: — nigdy echo/print/log naglowkow (GitHub maskuje ***);
  #   - NIGDY pull_request_target. Job nie biega na pull_request, wiec fork/dependabot
  #     i tak nigdy nie dotykaja tego toru (warunek antyforkowy stal sie zbedny).
  #
  # MODEL (Z6 §4 — cel: Haiku w CI): ZREALIZOWANE. Cala warstwa AI (src/lib/ai/*)
  # wybiera model przez centralny helper getModel (src/lib/ai/model.ts), sterowany
  # zmienna srodowiskowa SKILLBRIDGE_AI_MODEL. Job e2e-llm ustawia ja na Haiku 4.5
  # (env nizej) — caly dzial AI jedzie w CI na Haiku zamiast Sonnet/Opus. PRODUKCJA
  # bez zmiany: Vercel NIE ustawia tej zmiennej, wiec modele prod (Sonnet/Haiku/Opus
  # wg warstwy) zostaja bez regresji. Sufit wydatkow klucza CI dodatkowo chroni koszt.
  e2e-llm:
    name: e2e-llm (Playwright + onboarding sciezka #1)
    runs-on: ubuntu-latest
    # Tylko nocny cron (schedule) + reczne odpalenie (workflow_dispatch). NIE biega na
    # pull_request ani push — koszt modelu trzymany na jednym nocnym przebiegu.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Rate limiter (przyczyna nocnych padów 07/2026): build produkcyjny
      # (`next start`) ma boot-guard assertRateLimitConfigured() — bez configu
      # Upstash serwer NIE WSTAJE (RateLimitMisconfiguredError → timeout 120 s
      # webServera Playwrighta). Zamiast sekretów prod-Redisa (zanieczyszczanie
      # produkcyjnych liczników z CI): lokalny redis + SRH (serverless-redis-http)
      # — endpoint REST zgodny z Upstash na loopbacku. Guard produkcyjny zostaje
      # nietknięty, limity realnie DZIAŁAJĄ w testach, zero nowych sekretów.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          # Token loopbacku CI — nie sekret (para do UPSTASH_REDIS_REST_TOKEN niżej).
          SRH_TOKEN: e2e-ci-token
          # Nazwa uslugi `redis` dziala kontener→kontener (wspolna siec uslug joba).
          SRH_CONNECTION_STRING: "redis://redis:6379"
    env:
      # Auth: placeholder testowy (32 znaki) — nie sekret. Realny prod bierze z Vercela.
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      # Limiter → SRH (usluga wyzej); z perspektywy joba loopback:8079.
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: e2e-ci-token
      BETTER_AUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Zawor @dbwrite: bez tego testy zapisujace sie pomijaja (helpers/guards.ts).
      E2E_ALLOW_DB_WRITES: "1"
      # Klucz modelu — TYLKO tutaj, przez env. Nigdy echo/print. (Ryan, warunek higieny.)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
      # Override modelu CALEJ warstwy AI (src/lib/ai/model.ts → getModel): w CI caly
      # dzial AI jedzie na Haiku 4.5 zamiast Sonnet/Opus — ~3–5x tanszy token, ta sama
      # sciezka kodu. Prod (Vercel) tej zmiennej NIE ma → modele prod bez zmiany.
      SKILLBRIDGE_AI_MODEL: claude-haiku-4-5-20251001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DATABASE_URL bazy TESTOWEJ (usluga postgres, loopback) skladany z czesci
      # i eksportowany do GITHUB_ENV — guard assert-test-db przepuszcza localhost,
      # prod-Neon nigdy nie jest dotykany.
      - name: Ustaw DATABASE_URL i E2E_DATABASE_URL bazy testowej
        env:
          PGUSER: test
          PGPASS: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDB: skillbridge_test
        run: |
          AT='@'
          CREDS="${PGUSER}:${PGPASS}"
          DSN="postgresql://${CREDS}${AT}${PGHOST}:${PGPORT}/${PGDB}"
          echo "DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # seed:e2e czyta E2E_DATABASE_URL (osobna nazwa, ten sam loopback DSN).
          echo "E2E_DATABASE_URL=${DSN}" >> "$GITHUB_ENV"
          # Poswiadczenia kont testowych — IDENTYCZNE z domyslami seed-e2e.ts
          # (main/b4/resume). Helper loginWithPassword (helpers/auth.ts) wymaga ich
          # jawnie w procesie Playwright; bez nich rzuca "Brak poswiadczen konta".
          # To dane konta TESTOWEGO na bazie loopback, nie sekret produkcyjny;
          # eksport przez GITHUB_ENV (nie literal KEY: val), spojnie z DSN.
          PW='Test1234!e2e'
          echo "E2E_TEST_EMAIL=e2e-main@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=${PW}" >> "$GITHUB_ENV"
          echo "E2E_TEST_EMAIL_B4=e2e-b4@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD_B4=${PW}" >> "$GITHUB_ENV"
          echo "E2E_TEST_EMAIL_RESUME=e2e-resume@example.com" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD_RESUME=${PW}" >> "$GITHUB_ENV"
      # Przegladarka dla Playwright (chromium) + zaleznosci systemowe.
      - run: pnpm exec playwright install --with-deps chromium
      # Migracja schematu na bazie TESTOWEJ (guard allowlisty hostow testowych).
      - run: pnpm db:migrate:test
      # Katalog rynku (model kariery, 23 realne ścieżki): bez niego krok 3
      # wizarda uczciwie blokuje „Zatwierdź" („nie mamy jeszcze katalogu…") —
      # bieg nr 6 nocnego toru. Lokalne bazy deweloperów zawsze miały ten
      # ingest za sobą; świeża baza CI musi go dostać jawnie. Idempotentny
      # (no-op przy aktualnej wersji), guard assertTestDb jak w migracji.
      - run: pnpm db:ingest-career-model
      # Seed kont testowych (main/b4/resume) + danych — aktualne testy @llm loguja
      # sie na konta seed (loginWithPassword), nie rejestruja od zera. Idempotentny,
      # guardowany allowlista hostow testowych.
      - run: pnpm seed:e2e
      # Build artefaktu produkcyjnego — `next start` go serwuje (Z6 §3, R2).
      - run: pnpm build
      # Twardy fail-fast: jesli sekret nie dotarl (np. usuniety z repo), NIE chcemy
      # falszywie zielonego "pass" przez ciche test.skip segmentu @llm. Pusty klucz
      # na nocnym przebiegu = realny problem, zatrzymujemy job.
      - name: Wymagaj klucza modelu (nocny przebieg)
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Brak klucza modelu (sekret ANTHROPIC_API_KEY_CI). Job e2e-llm nie moze zweryfikowac segmentu @llm."
            exit 1
          fi
          echo "Klucz modelu obecny (wartosc zamaskowana przez GitHub)."
      # ZAKRES TESTOW: PELNY pakiet @llm (10-b0, 20-B4, 40), z wykluczeniem
      # przeterminowanego 50 (Z5 — pomija nowy Krok 0, do przepisania). Job biega tylko
      # nocnym cronem/recznie, wiec zawsze pelny zakres (brak juz wariantu per-PR).
      # E2E_LLM_AVAILABLE=1 zdejmuje test.skip segmentow @llm (klucz po stronie serwera).
      - name: Ustaw zakres testow
        run: |
          echo "E2E_LLM_SPEC=tests/e2e-pw/10-b0-pomocnik-kariery.spec.ts tests/e2e-pw/20-b1-b4-dashboard-projects.spec.ts tests/e2e-pw/40-onboarding-sylabus-pdf.spec.ts" >> "$GITHUB_ENV"
          echo "E2E_LLM_GREP=@llm" >> "$GITHUB_ENV"
      - name: Playwright e2e-llm (sciezka onboarding + model)
        env:
          E2E_LLM_AVAILABLE: "1"
        run: pnpm exec playwright test --config playwright.config.ci.ts --grep "${E2E_LLM_GREP}" ${E2E_LLM_SPEC}
      # Artefakty diagnostyczne przy padzie (trace/screenshot — bez sekretow w logu).
      - name: Upload raportu Playwright (przy padzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-llm
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # nocny-alarm — zamiana cichej czerwieni toru nocnego na imienne zgloszenie.
  #
  # MECHANIZM AWARII, ktory tu zamykamy (i tylko ten): nocny przebieg `main` moze
  # byc czerwony dowolnie dlugo, bo NIKT GO NIE OGLADA. Czerwony check-run wisi na
  # commicie `main`, ktory nie bramkuje juz zadnego PR-a, wiec nie zatrzymuje pracy
  # i nie rzuca sie w oczy. Zdarzylo sie DWA razy:
  #   - 2026-08-02..05 — cztery doby, wykryte przypadkiem;
  #   - 2026-08-08..10 — trzy doby (przebiegi 31238746259, 31294101208, 31355398651),
  #     wykryte przypadkiem przy zupelnie innej kontroli.
  # Za kazdym razem 12 zadan zielonych i JEDNO czerwone. Brakujacym elementem nie byl
  # czujnik (bramka dzialala poprawnie) — brakowalo doreczenia sygnalu do czlowieka.
  #
  # DLACZEGO `needs` OBEJMUJE WSZYSTKIE 12 BRAMEK, A NIE `deps-scan`:
  # oba incydenty padly na `deps-scan`, ale to wlasnosc probki, nie mechanizmu.
  # Mechanizm brzmi „nikt nie oglada nocnego przebiegu" i dotyczy KAZDEJ bramki.
  # Alarm wpiety w jedna bramke bylby strazikiem pilnujacym dokladnie tego wypadku,
  # ktory juz nas ugryzl — i milczalby, gdyby nocna czerwien przyszla z `integration`
  # albo `e2e-llm`. Stad zaleznosc od kompletu; `failure()` jest prawdziwe, gdy
  # padnie DOWOLNA z nich.
  #
  # DLACZEGO `schedule` I `workflow_dispatch` (a nie sam `schedule`):
  # ten sam warunek co `e2e-llm` wyzej — w tym pliku „tor nocny" jest juz zdefiniowany
  # jako ta para. Dodatkowo czyni alarm ODPALALNYM NA ZADANIE, czyli mozliwym do
  # ponownego udowodnienia w kazdej chwili (CLAUDE.md §8: strazik bez mutacji, ktora
  # go czerwieni, nie jest strazikiem). Alarm NIE biega na `pull_request` ani `push`
  # — tam czerwien ma juz swojego odbiorce (autor PR-a widzi czerwony check).
  #
  # CZEGO TEN ALARM NIE ZLAPIE — luki nazwane wprost, nie przemilczane:
  #   1. PRZEBIEG, KTORY W OGOLE NIE WYSTARTOWAL. Jesli cron nie odpali (awaria
  #      GitHub Actions — zdarzylo sie 2026-08-06; GitHub wygasza tez cron w repo
  #      bez aktywnosci przez 60 dni), nie ma przebiegu, wiec nie ma czego zaczerwienic
  #      i alarm MILCZY. Cisza jest wtedy NIEODROZNIALNA OD SUKCESU. To luka
  #      strukturalna: czujnik zywosci nie moze mieszkac w tym samym systemie, ktory
  #      ma obserwowac. Zamkniecie wymaga sygnalu Z ZEWNATRZ (monitoring typu
  #      dead-man's switch — domena 13, osobne zadanie).
  #   2. PRZEBIEG ANULOWANY (`cancelled`) — `failure()` jest wtedy falszywe. Swiadomie
  #      NIE dokladam tu `cancelled()`: nie umiem tego udowodnic ta sama mutacja, a
  #      nieudowodniona galaz strazika to atrapa dajaca falszywy spokoj. Osobne
  #      zadanie z wlasnym dowodem.
  #   3. BRAMKA, KTORA JEST ZIELONA, A NIE POWINNA (falszywa zielen — np. testy ciche
  #      pomijane przy braku `DATABASE_URL`). Alarm doreecza sygnal, nie ocenia go.
  #   4. PAD SAMEGO ALARMU. Jesli `gh issue create` padnie (blad API, cofniete
  #      uprawnienie `issues: write`), zadanie konczy sie czerwono i zgloszenie NIE
  #      POWSTAJE — a czerwony przebieg to znowu tylko check-run, ktorego nikt nie
  #      oglada. Strazik nie pilnuje sam siebie. To ta sama rodzina co luka 1:
  #      domkniecie wymaga sygnalu SPOZA Actions, nie kolejnego zadania w Actions.
  #      Dlatego odczyty diagnostyczne nizej sa tolerancyjne (`|| true`) — zwezamy
  #      pas awarii do samego zapisu zgloszenia, ale go NIE ZAMYKAMY.
  nocny-alarm:
    name: nocny-alarm (zgloszenie przy czerwonym torze nocnym)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - integration
      - build
      - secret-scan
      - deps-scan
      - a11y-exam
      - a11y-tutor
      - a11y-review
      - rate-limit-review
      - e2e-llm
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write # otwarcie/odswiezenie zgloszenia + utworzenie etykiety
      actions: read # odczyt listy zadan tego przebiegu (ktore dokladnie padly)
    steps:
      - name: Otworz albo odswiez zgloszenie o czerwonym torze nocnym
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GALAZ: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ZDARZENIE: ${{ github.event_name }}
          ETYKIETA: nocny-przebieg
          # Jedyne konto przypisywalne w tym repo (sprawdzone: `gh api
          # repos/.../assignees` zwraca wylacznie `Danolog`). Agenty nie maja kont
          # GitHuba, wiec role odpowiedzialne nazywamy w TRESCI zgloszenia.
          PRZYPISZ: Danolog
        run: |
          set -uo pipefail

          # Ktore zadania faktycznie padly — lista do tresci zgloszenia.
          #
          # CELOWO BEZ `set -e` I Z `|| true`: diagnostyka alarmu NIE MOZE zabic
          # alarmu. Gdyby odczyt listy zadan padl (limit API, chwilowy blad), przy
          # `set -e` caly krok konczy sie bledem i zgloszenie NIE POWSTAJE — czyli
          # dokladnie ta cisza, ktorej to zadanie ma zapobiegac. Lepsze zgloszenie
          # bez listy zadan niz brak zgloszenia.
          PADLE=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | "- `\(.name)`"] | join("\n")' || true)
          if [ -z "${PADLE:-}" ]; then
            PADLE="- (nie udalo sie odczytac listy zadan — patrz przebieg)"
          fi
          LICZBA_PADLYCH=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure")] | length' || true)
          LICZBA_PADLYCH=${LICZBA_PADLYCH:-"?"}

          # Etykieta idempotentnie — pierwszy przebieg w swiezym repo tez ma zadzialac.
          gh label create "$ETYKIETA" --repo "$REPO" \
            --color B60205 --description "Tor nocny CI czerwony — wymaga reakcji" \
            2>/dev/null || true

          TERAZ=$(date -u '+%Y-%m-%d %H:%M UTC')

          {
            echo "**Tor nocny jest czerwony.** Odczyt: $TERAZ"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Przebieg | [$RUN_ID]($RUN_URL) |"
            echo "| Zdarzenie | \`$ZDARZENIE\` |"
            echo "| Galaz | \`$GALAZ\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Zadan czerwonych | $LICZBA_PADLYCH |"
            echo
            echo "**Co padlo:**"
            echo
            echo "$PADLE"
          } > tresc.md

          # Dedup: JEDNO zgloszenie odswiezane, nie jedno na noc. Trzy czerwone noce
          # pod rzad maja dac jeden watek z trzema wpisami — inaczej alarm sam
          # zamienia sie w szum, ktory sie ignoruje (czyli w te sama awarie).
          NUMER=$(gh issue list --repo "$REPO" --label "$ETYKIETA" --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$NUMER" ]; then
            echo "Zgloszenie #$NUMER juz otwarte — odswiezam komentarzem (bez duplikatu)."
            gh issue comment "$NUMER" --repo "$REPO" --body-file tresc.md
            echo "ODSWIEZONO=#$NUMER" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "---"
              echo
              echo "Zgloszenie otwarte automatycznie przez zadanie \`nocny-alarm\`."
              echo "Zostaje otwarte i odswiezane kolejnymi wpisami, dopoki tor nocny"
              echo "nie wroci na zielono — **zamkniecie jest recznym potwierdzeniem**,"
              echo "ze ktos to widzial."
              echo
              echo "Odpowiedzialni (agenty nie maja kont GitHuba, wiec imiennie w tresci):"
              echo "**Eva** (platforma/CI) prowadzi, **Ethan** (CTO) scala naprawe,"
              echo "**Leo** recenzuje. Przypisanie techniczne: @$PRZYPISZ."
            } >> tresc.md
            # `gh issue create` NIE wspiera `--json` — zwraca URL nowego zgloszenia.
            # Jedno wywolanie, zeby zadna sciezka bledu nie mogla utworzyc duplikatu.
            NOWY=$(gh issue create --repo "$REPO" \
              --title "Tor nocny CI na \`main\` jest czerwony" \
              --label "$ETYKIETA" \
              --assignee "$PRZYPISZ" \
              --body-file tresc.md | tail -1)
            echo "OTWARTO=$NOWY" >> "$GITHUB_STEP_SUMMARY"
          fi
