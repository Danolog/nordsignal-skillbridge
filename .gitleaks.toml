# ─────────────────────────────────────────────────────────────────────────────
# Własne reguły skanu sekretów — SkillBridge (B8, fala 1)
#
# Skan sekretów (gitleaks) do 2026-09-02 chodził wyłącznie po regułach
# DOMYŚLNYCH. Ten plik ich nie zastępuje — rozszerza (`useDefault = true`).
# Dwa człony, obie strony tej samej monety:
#
#   1. REGUŁA DODATNIA — dokładamy wzorzec, którego domyślne reguły nie mają:
#      klucz API Neona. Ten klucz daje pełną władzę nad projektem produkcyjnej
#      bazy, łącznie ze skasowaniem bazy razem z kopiami zapasowymi.
#   2. ALLOWLISTA UJEMNA — przestajemy krzyczeć na atrapy haseł w testach.
#
# CZEGO TU ŚWIADOMIE NIE MA: ani jednego odcisku palca (`fingerprint`). Odcisk
# zawiera identyfikator commita, a identyfikatory zmieniają się przy każdej
# aktualizacji gałęzi do `main` i przy scaleniu ze zgnieceniem (squash).
# Wyciszenie oparte na odcisku rozsypuje się w ciągu jednej nocy i wraca jako
# ta sama czerwona bramka. Opisujemy WŁASNOŚĆ trafienia (kształt wartości),
# nie jego adres w historii. Plik `.gitleaksignore` z odciskami zostaje
# nietknięty jako rusztowanie historyczne — patrz komentarz w nim.
# ─────────────────────────────────────────────────────────────────────────────

title = "nordsignal SkillBridge — reguly skanu sekretow"

# Prog wersji narzedzia. Bez niego starszy gitleaks, ktory nie zna klucza
# `targetRules` ani tablicy `[[allowlists]]`, POMIJA je po cichu i chodzi po
# konfiguracji innej niz ta, ktora zmierzylismy — czyli daje sygnal, nie
# sprawdzajac tego, co mial sprawdzic. Z progiem pada glosno.
# Zmierzone 2026-09-02: akcja `gitleaks-action@v3` nie ustawia zmiennej
# GITLEAKS_VERSION, wiec ciagnie najnowsze wydanie — v8.30.1 z 2026-03-21,
# czyli dokladnie te, na ktorej wykonano wszystkie pomiary tego pliku.
minVersion = "8.30.1"

[extend]
useDefault = true

# ─── CZŁON 1: reguła dodatnia ────────────────────────────────────────────────
#
# DLACZEGO OSOBNA REGUŁA, skoro domyślne czasem ten klucz łapią. Zmierzone
# 2026-09-02 na gitleaks 8.30.1 — ten sam losowy klucz w trzech opakowaniach:
#
#   napi_<64>                                        → no leaks found   ← LUKA
#   Authorization: Bearer napi_<64>                  → leaks found: 1
#   const NEON_TOKEN = "napi_<64>"                   → leaks found: 1
#
# Reguła `generic-api-key` z zestawu domyślnego potrzebuje SŁOWA KLUCZOWEGO w
# pobliżu (`token`, `key`, `bearer`) i przekroczonego progu entropii. Klucz
# stojący sam — czyli dokładnie w postaci, w jakiej trafia do wiersza pliku
# `.env`, do dziennika procesu, do zrzutu JSON albo do zmiennej powłoki —
# przechodzi przez skan bez śladu. Reguła niżej zaczepia się o PRZEDROSTEK, a
# nie o kontekst, więc łapie klucz w każdym z trzech opakowań.
#
# DLACZEGO {32,80}, A NIE {64}. Zlecenie mówi „przedrostek + 64 znaki" i taką
# długość ma klucz, którego kształt odtworzyliśmy. Widełki są celową polisą:
# gdyby Neon zmienił długość klucza albo gdyby założenie o 64 znakach było
# błędne, reguła przypięta sztywno do 64 nigdy by się nie odezwała i byłaby
# strażnikiem-atrapą (CLAUDE.md §8, v1.17). Przedrostek `napi_` jest na tyle
# swoisty, że rozluźnienie długości nie kosztuje fałszywych trafień —
# zmierzone: 0 wystąpień `napi_` w całym drzewie repozytorium na 2026-09-02.
[[rules]]
id = "neon-api-key"
description = "Klucz API Neona (napi_) — pelna wladza nad projektem bazy produkcyjnej"
regex = '''\bnapi_[A-Za-z0-9]{32,80}\b'''
keywords = ["napi_"]

# ─── CZŁON 2: allowlista ujemna ──────────────────────────────────────────────
#
# CO GASIMY. Nocny skan pełnej historii był czerwony 25.08–01.09 na trzech
# trafieniach `generic-api-key` — wszystkie w jednym pliku testowym warstwy
# uwierzytelniania, wszystkie to ten sam literał hasła-atrapy przekazywany do
# formularza logowania. Test dowodzi kształtu odmowy serwera; wartość hasła
# jest w nim bez znaczenia z definicji, bo logowanie ma się NIE udać.
#
# DLACZEGO NIE MA TU KLUCZA `paths` — to jest sedno tej konfiguracji i wynik
# pomiaru, nie preferencja. Zmierzone 2026-09-02 na trzech wariantach tego
# pliku, na tym samym pliku próbnym z trzema wierszami (atrapa hasła / sekret
# o wysokiej entropii bez słowa „haslo" / atrapa klucza Neona):
#
#   paths + regexes + matchCondition = "AND"   → wyciszone WSZYSTKIE trzy
#   paths + regexes niepasujący  + "AND"       → wyciszone WSZYSTKIE trzy
#   same regexes (bez paths)                   → wyciszona TYLKO atrapa hasła
#
# Wniosek: w allowliście globalnej `paths` pomija CAŁY PLIK, zanim w ogóle
# dojdzie do oceny wartości — warunek `matchCondition = "AND"` nie ma czego
# łączyć, bo sekret na tym etapie jeszcze nie istnieje. Konfiguracja
# „ścieżka ORAZ wzorzec" wygląda na precyzyjne wyciszenie, a jest dziurą
# wielkości całego katalogu testów: przepuściłaby prawdziwy klucz Neona
# wklejony do dowolnego pliku testowego. Wykryte kontrolą dwustronną, nie
# czytaniem — pierwsza wersja tego pliku miała `paths` i tę dziurę.
#
# JAK OPISANE ZAMIAST TEGO: warunek na KSZTAŁCIE wartości.
#   `^([a-z0-9]+[-_])*has[lł]o([-_][a-z0-9]+)*$`
# czyli: wartość jest łańcuchem MAŁYCH liter i cyfr łączonych myślnikiem lub
# podkreśleniem, w którym jednym z członów jest słowo „haslo" albo „hasło".
# Trafia w atrapy w rodzaju `dowolne-haslo-123`. NIE trafia w nic, co ma wielką
# literę, znak specjalny albo losowy szum — czyli w nic, co wygląda na prawdziwe
# poświadczenie. Prawdziwe hasło produkcyjne zawierające słowo „haslo" nadal
# się zapali, o ile ma cokolwiek poza małymi literami i myślnikami.
#
# ⚠ SPROSTOWANIE (Leo znalazł, Ethan potwierdził pomiarem, 2026-09-02).
# Do tej wersji wzorzec zaczynał się flagą `(?i)`, która czyni CAŁE wyrażenie
# niewrażliwym na wielkość liter — więc `[a-z0-9]` łapało także `A–Z`, a akapit
# wyżej był NIEPRAWDZIWY akurat o tę własność, na której stoi cała obrona
# rezygnacji z `paths`. Zmierzone na wzorcu z pliku (atrapy syntetyczne, nie
# z repozytorium; wartości nie cytujemy — v1.16 „dowód bez ujawnienia"):
#     wartosc wygladajaca na poswiadczenie   z (?i): PASUJE   bez (?i): nie
#     wartosc pisana wielkimi literami       z (?i): PASUJE   bez (?i): nie
#     losowy szum z wielkimi literami        z (?i): PASUJE   bez (?i): nie
# Złożone z brakiem `paths` dawało to jedno zdanie: prawdziwe poświadczenie
# o kształcie `cos-haslo-Cos1`, w DOWOLNYM pliku repozytorium, nie zostałoby
# wykryte — ani przez regułę domyślną (bo wyciszone), ani przez nic innego.
#
# NAPRAWA: usunięta flaga, nie rozszerzony komentarz. Zawężamy MECHANIZM do
# DEKLARACJI, nie odwrotnie — w konfiguracji skanu sekretów węższa allowlista
# jest zawsze lepszym domyślnym wyborem. Że nic to nie kosztuje, jest zmierzone
# na historycznej wersji pliku testowego (`5f503cf`), tam gdzie trafienia jeszcze
# żyją — pomiar niezależnie powtórzony po obu stronach przeglądu:
#     pasuje Z (?i): 3   |   pasuje BEZ (?i): 3   |   psuje wyciszenie: NIE
#     każde trafienie: długość 17, wyłącznie małe litery i separatory
# Trójka zgadza się co do sztuki z `leaks found: 3` skanu nocnego.
#
# ZASIĘG, JAWNIE: bez klucza `paths` ta allowlista działa na KAŻDY plik w zasięgu
# `generic-api-key`, także produkcyjny — nie tylko na testy. `paths` NIE wraca
# (powód wyżej: w allowliście globalnej pomija cały plik, zanim dojdzie do oceny
# wartości). Zawężenie robi wyłącznie kształt wartości, dlatego kształt musi być
# wąski naprawdę, a nie tylko w opisie.
#
# CZŁON UJEMNY JEST Z NATURY TYMCZASOWY. Dziś działa WYŁĄCZNIE na historię:
# bieżąca treść pliku testowego nie zawiera już żadnego literału hasła — po
# naprawie z #344 stoi tam stała składana z tablicy, której wartość nie zawiera
# członu „haslo", więc do tej allowlisty nie pasuje i pasować nie musi.
# Wyciszenie obsługuje commity, które widzi skan nocny (`--full-history --all`).
# PRÓG: gdy historia przestanie być skanowana albo zostanie zgnieciona, ten człon
# traci przedmiot — wtedy usunąć go razem z tym akapitem, zamiast zostawiać jako
# martwą regułę. Właściciel: Ethan.
#
# DLACZEGO WZORZEC, A NIE CAŁY LITERAŁ. Gdyby allowlista cytowała dokładne
# brzmienie atrapy, przemianowanie stałej w teście cicho ją unieważnia i nocna
# bramka wraca na czerwono bez żadnego sygnału. Dodatkowo literał nie jest tu
# powtórzony, więc ten plik nie staje się drugim nośnikiem atrapy
# (CLAUDE.md §8, v1.17 „jeden nośnik").
#
# `targetRules` zawęża wyciszenie do JEDNEJ reguły domyślnej — i uczciwie:
# w TEJ wersji pliku nie jest nośny. Zmierzone 2026-09-02 (mutacja M4):
# usunięcie `targetRules` z konfiguracji końcowej nie zmienia ani jednego
# trafienia na pliku próbnym, bo oba wzorce wykluczają się z konstrukcji —
# wartość pasująca do allowlisty składa się z członów oddzielonych myślnikiem
# lub podkreśleniem, a reguła Neona wymaga 32+ znaków ALFANUMERYCZNYCH z rzędu
# tuż za przedrostkiem. Nie da się napisać napisu spełniającego oba warunki.
# `targetRules` zostaje mimo to, jako ograniczenie promienia rażenia na
# przyszłość: gdyby ktoś dołożył regułę wykrywającą token o kształcie
# słowo-myślnik-słowo, allowlista nie zdejmie jej po cichu. Nośny był w
# wariancie z kluczem `paths` (wariant C wyżej: bez `targetRules` wyciszał
# także regułę Neona) — po usunięciu `paths` ta przesłanka wygasła.
# Zgodnie z CLAUDE.md §8 v1.17 opisujemy to jako zabezpieczenie
# NIEPOTWIERDZONE mutacją, a nie jako działającego strażnika.
[[allowlists]]
description = "Atrapy hasel — wartosc o ksztalcie slowa-z-myslnikami (TYLKO male litery) z czlonem 'haslo'; dziala w KAZDYM pliku, nie tylko w testach (klucz paths swiadomie usuniety — powod w komentarzu wyzej)"
targetRules = ["generic-api-key"]
regexes = ['''^([a-z0-9]+[-_])*has[lł]o([-_][a-z0-9]+)*$''']
